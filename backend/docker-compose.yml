services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wedding
      MYSQL_USER: wedding
      MYSQL_PASSWORD: wedding_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - wedding_mysql_data:/var/lib/mysql

volumes:
  wedding_mysql_data:
